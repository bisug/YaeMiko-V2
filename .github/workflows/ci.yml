name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The suite asserts PTB 22.8 field names against the real package, so the
      # pinned version has to be importable. Without this the test only passes
      # on a machine that happens to have the dependency installed.
      - name: Install the Telegram client under test
        run: python -m pip install --disable-pip-version-check "python-telegram-bot[rate-limiter,job-queue]==22.8"

      - name: Verify the installed version
        run: |
          version=$(python -c "import telegram; print(telegram.__version__)")
          echo "python-telegram-bot $version"
          if [ "$version" != "22.8" ]; then
            echo "FAIL expected python-telegram-bot 22.8, found $version"
            exit 1
          fi

      - name: Validate JSON manifests
        run: |
          python -m json.tool app.json >/dev/null
          python -m json.tool railway.json >/dev/null

      - name: Validate deployment manifests
        run: python tests/validate_deployment.py

      - name: Validate documentation
        run: python tests/validate_docs.py

      - name: Compile application
        run: python -m compileall -q .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check whitespace
        run: git diff --check

      - name: Check no committed secrets
        run: |
          status=0
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "FAIL .env is tracked, it must stay in .gitignore"
            status=1
          fi
          if git grep -nIE '(^|[^A-Za-z0-9_])[0-9]{6,10}:[A-Za-z0-9_-]{30,}' -- \
            '*.py' '*.json' '*.yml' '*.md' '*.svg' ':!tests/*'; then
            echo "FAIL a bot token is committed in the source"
            status=1
          fi
          exit $status

  docker:
    name: Build worker image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: yaemiko:ci

      - name: Verify the image entry point
        run: |
          image_id=$(docker image inspect yaemiko:ci --format '{{.Id}}')
          entrypoint=$(docker image inspect yaemiko:ci \
            --format '{{json .Config.Cmd}}')
          echo "image: $image_id"
          echo "cmd: $entrypoint"
          if [ "$entrypoint" != '["python","-m","Mikobot"]' ]; then
            echo "FAIL the image CMD must be python -m Mikobot"
            exit 1
          fi
