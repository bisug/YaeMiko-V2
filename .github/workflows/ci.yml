name: CI

on:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md]
  pull_request:
    paths-ignore: [CHANGELOG.md]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check lockfile is current
        run: uv lock --check
      - name: Check runtime pins match requirements.txt
        run: |
          python - <<'PY'
          from importlib.metadata import version

          pins = {}
          for line in open("requirements.txt"):
              line = line.split("#")[0].strip()
              if "==" in line:
                  name, pinned = line.split("==", 1)
                  pins[name.split("[")[0].strip().lower()] = pinned.split(";")[0].strip()

          for name in ("kurigram", "sqlalchemy", "psycopg", "onnxruntime", "kuricrypt", "uvloop"):
              pinned, installed = pins[name], version(name)
              print(f"{name}: pinned {pinned}, installed {installed}")
              if installed != pinned:
                  raise SystemExit(f"{name}: pinned {pinned}, installed {installed}")
          PY
      - name: Report Kurigram version drift
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from importlib.metadata import version

          latest = json.load(
              urllib.request.urlopen("https://pypi.org/pypi/kurigram/json", timeout=10)
          )["info"]["version"]
          pinned = version("kurigram")
          print(f"kurigram: pinned {pinned}, latest {latest}")
          PY
      - name: Validate JSON manifests
        run: |
          python -m json.tool app.json >/dev/null
          python -m json.tool railway.json >/dev/null
      - name: Compile sources
        run: python -m compileall -q .
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Check whitespace
        run: git diff --check
      - name: Check for committed secrets
        run: |
          status=0
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must stay in .gitignore"
            status=1
          fi
          if git grep -nIE '(^|[^A-Za-z0-9_])[0-9]{6,10}:[A-Za-z0-9_-]{30,}' -- \
            '*.py' '*.json' '*.yml' '*.md' '*.svg' ':!tests/*'; then
            echo "::error::bot token committed in source"
            status=1
          fi
          exit $status

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DB_NAME: MIKO_DB
      TOKEN: "0000000000:CIPLACEHOLDERNOTAREALTOKEN"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: yaemiko:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Verify image
        run: |
          cmd=$(docker image inspect yaemiko:ci --format '{{json .Config.Cmd}}')
          echo "CMD: $cmd"
          if [ "$cmd" != '["python","-m","Mikobot"]' ]; then
            echo "::error::unexpected image CMD: $cmd"
            exit 1
          fi
          docker run --rm yaemiko:ci python -c "from pyrogram import Client; import sqlalchemy, psycopg; print('core dependencies present')"
