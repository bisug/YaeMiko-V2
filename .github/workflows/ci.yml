name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The SQL layer is only exercised against a real PostgreSQL; without one
    # those tests skip and a broken column type or query would go unnoticed.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DB_NAME: MIKO_DB
      # Placeholder so importing Mikobot does not need a real token.
      TOKEN: "0000000000:CIPLACEHOLDERNOTAREALTOKEN"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The suite asserts framework constructors against the real package, and
      # the SQL-layer tests need a real driver to reach the postgres service
      # above. Both versions are read out of requirements.txt rather than
      # repeated here, so a Dependabot bump touches one file: without that a
      # bump to requirements.txt left these literals behind and the run failed
      # against an install nobody had asked for.
      - name: Install the dependencies under test
        run: |
          pins=$(grep -E '^(aiogram|SQLAlchemy|psycopg)(\[|==)' requirements.txt | tr '\n' ' ')
          echo "installing: $pins"
          python -m pip install --disable-pip-version-check $pins

      # Guards the install above rather than the pin itself: a requirements.txt
      # edit that fails to install must not pass as a green build.
      - name: Verify the installed versions match the pins
        run: |
          python - <<'PY'
          import re, sys
          from importlib.metadata import version

          pins = {}
          for line in open("requirements.txt"):
              line = line.split("#")[0].strip()
              if "==" in line:
                  name, pinned = line.split("==", 1)
                  # psycopg[binary,pool]==3.3.6 installs as psycopg.
                  pins[name.split("[")[0].strip().lower()] = pinned.strip()

          wrong = []
          for name in ("aiogram", "sqlalchemy", "psycopg"):
              pinned = pins[name]
              installed = version(name)
              print(f"{name} pinned {pinned}, installed {installed}")
              if installed != pinned:
                  wrong.append(f"{name}: pinned {pinned}, installed {installed}")
          if wrong:
              print("FAIL " + "; ".join(wrong), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Validate JSON manifests
        run: |
          python -m json.tool app.json >/dev/null
          python -m json.tool railway.json >/dev/null

      - name: Validate deployment manifests
        run: python tests/validate_deployment.py

      - name: Validate documentation
        run: python tests/validate_docs.py

      - name: Compile application
        run: python -m compileall -q .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check whitespace
        run: git diff --check

      - name: Check no committed secrets
        run: |
          status=0
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "FAIL .env is tracked, it must stay in .gitignore"
            status=1
          fi
          if git grep -nIE '(^|[^A-Za-z0-9_])[0-9]{6,10}:[A-Za-z0-9_-]{30,}' -- \
            '*.py' '*.json' '*.yml' '*.md' '*.svg' ':!tests/*'; then
            echo "FAIL a bot token is committed in the source"
            status=1
          fi
          exit $status

  docker:
    name: Build worker image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: yaemiko:ci
          # Buildx uses the docker-container driver, so without load the image
          # stays inside the builder and the inspect step below cannot see it.
          load: true

      - name: Verify the image CMD
        run: |
          image_id=$(docker image inspect yaemiko:ci --format '{{.Id}}')
          cmd=$(docker image inspect yaemiko:ci --format '{{json .Config.Cmd}}')
          echo "image: $image_id"
          echo "cmd: $cmd"
          if [ "$cmd" != '["python","-m","Mikobot"]' ]; then
            echo "FAIL the image CMD must be python -m Mikobot, found $cmd"
            exit 1
          fi
