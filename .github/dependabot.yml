version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: "UTC"
    labels: [dependencies, python]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: "UTC"
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
