[project]
name = "yaemiko"
version = "2.0.0"
description = "A powerful Telegram group management bot"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiogram==3.31.0",
    "apscheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "cachetools==8.0.0",
    "emoji==2.16.0",
    "httpx[http2]==0.28.1",
    "humanize==4.16.0",
    "kurigram==2.2.27",
    "nekos.py==1.1.0",
    'onnxruntime==1.31.1; python_version < "3.15"',
    'opennsfw-onnx==0.1.0; python_version < "3.15"',
    "pillow==13.0.0",
    "psutil==7.2.2",
    "psycopg[binary,pool]==3.3.8",
    "pyjokes==0.8.3",
    "pyrate-limiter==4.5.1",
    "requests==2.34.2",
    "speedtest-cli==2.1.3",
    "sqlalchemy==2.1.8",
    "telegraph==2.2.0",
    "kuricrypt==0.1.1",
    "unidecode==1.4.0",
    'uvloop==0.23.0; sys_platform != "win32"',
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py315"
extend-exclude = ["Extra"]

[tool.ruff.lint]
# The default set of ruff 0.17 flags more than the code here can absorb:
# every logging call in this repository formats lazily with %s, and the
# handlers deliberately catch broad exceptions and log them. The rules
# below are the ones that catch real defects, and the per-file ignores
# below name the exceptions.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4"]
ignore = [
    # A bare except that only logs and continues is the house style for
    # cleanup paths.
    "SIM105",
    # The handler bodies here are long and branchy by nature.
    "SIM102",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# These modules import their dependencies for the side effect of
# registering the tables, so the names are unused by name.
"Database/sql/__init__.py" = ["F401"]
# The startup module pulls the help strings in as a star import.
"Mikobot/__main__.py" = ["F403", "F405"]

[tool.ty.src]
include = ["Mikobot", "Database"]

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
call-non-callable = "ignore"
invalid-return-type = "ignore"
invalid-parameter-default = "ignore"
unknown-argument = "ignore"
invalid-type-form = "ignore"
not-subscriptable = "ignore"
no-matching-overload = "ignore"
unsupported-operator = "ignore"
too-many-positional-arguments = "ignore"
unused-awaitable = "ignore"
redundant-condition = "ignore"
