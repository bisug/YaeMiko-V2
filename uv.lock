    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "apscheduler", specifier = "==3.11.3" },
    { name = "beautifulsoup4", specifier = "==4.15.0" },
    { name = "cachetools", specifier = "==8.0.0" },
    { name = "emoji", specifier = "==2.16.0" },
    { name = "httpx", extras = ["http2"], specifier = "==0.28.1" },
    { name = "humanize", specifier = "==4.16.0" },
    { name = "kuricrypt", specifier = "==0.1.1" },
    { name = "kurigram", specifier = "==2.2.27" },
    { name = "nekos-py", specifier = "==1.1.0" },
    { name = "onnxruntime", marker = "python_full_version < '3.15'", specifier = "==1.31.1" },
    { name = "opennsfw-onnx", marker = "python_full_version < '3.15'", specifier = "==0.1.0" },
    { name = "pillow", specifier = "==13.0.0" },
    { name = "psutil", specifier = "==7.2.2" },
    { name = "psycopg", extras = ["binary", "pool"], specifier = "==3.3.8" },
    { name = "pyjokes", specifier = "==0.8.3" },
    { name = "pyrate-limiter", specifier = "==4.5.1" },
    { name = "requests", specifier = "==2.34.2" },
    { name = "speedtest-cli", specifier = "==2.1.3" },
    { name = "sqlalchemy", specifier = "==2.1.8" },
    { name = "telegraph", specifier = "==2.2.0" },
    { name = "unidecode", specifier = "==1.4.0" },
    { name = "uvloop", marker = "sys_platform != 'win32'", specifier = "==0.23.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.3.0" },
    { name = "pytest-asyncio", specifier = ">=0.24.0" },
    { name = "ruff", specifier = ">=0.17.0" },
]
